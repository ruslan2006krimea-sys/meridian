<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050C29">
<title>Меридиан — маршрут Севи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Tektur:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ===== Токены «Меридиан». Заголовочный шрифт Hibiny; пока его нет — Tektur. Подключить Hibiny: поменять --font-display ===== */
:root{
  --fog:#F4F8FF;
  --navy-50:#F4F7FE;--navy-100:#E3EBFF;--navy-200:#CAD7F9;--navy-300:#A8BAE7;--navy-400:#8397CB;--navy-500:#586CA4;--navy-600:#324377;--navy-700:#223163;--navy-800:#152250;--navy-900:#09133D;--navy-950:#03062C;
  --amber-300:#F2B682;--amber-400:#E49E5E;--amber-500:#D3873C;--amber-600:#B36D24;--amber-700:#8E530D;
  --n-500:#777A82;--n-600:#55585F;
  --err-dark:#F2897E;--err-light:#AC312C;
  /* тон подложки: Соловки (холодный) — фото архипелага */
  --lo:#050C29;--hi:#AFC7E1;
  --glass:rgba(9,19,61,.5);--glass-line:rgba(255,255,255,.2);
  --cut-s:10px;--cut-m:16px;--cut-l:24px;--cut-xl:40px;
  --font-display:"Hibiny","Tektur",system-ui,sans-serif;
  --font-text:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--lo)}
body{font:400 15px/22px var(--font-text);color:#fff;min-height:100vh;min-height:100dvh;overflow-x:hidden;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
img,svg{display:block}

/* ===== Подложка: фото (полупрозрачное, ч/б) → тон → узоры → скрим ===== */
.sub{position:fixed;inset:0;isolation:isolate;background:var(--lo);z-index:-1;overflow:hidden}
.sub img.photo{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:grayscale(1) contrast(1.08);opacity:.72;transition:opacity .4s var(--ease)}
.sub img.photo[hidden]{display:none}
.sub::before{content:"";position:absolute;inset:0;z-index:1;background:var(--hi);mix-blend-mode:multiply}
.sub::after{content:"";position:absolute;inset:0;z-index:2;background:var(--lo);mix-blend-mode:lighten}
.scrim{position:absolute;inset:0;z-index:3;transition:background .24s var(--ease)}
.scrim.ambient{background:linear-gradient(rgba(5,12,41,.38),rgba(5,12,41,.82))}
.scrim.focus{background:rgba(5,12,41,.66)}
.scrim.reading{background:rgba(5,12,41,.8)}
.scrim.camera{background:#07090E}
.pat{position:absolute;z-index:4;pointer-events:none;transition:opacity .4s}
.pat.waves{left:0;right:0;bottom:0;height:34%;background:url(img/waves-amber.svg) 0 0/80px 24px repeat;opacity:.3;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
.pat.waves-top{left:0;right:0;top:0;height:26%;background:url(img/waves-fog.svg) 0 0/80px 24px repeat;opacity:.14;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.pat.rings{top:-170px;right:-200px;width:460px;height:560px;background:url(img/rings.svg) no-repeat 0 0/100% 100%;opacity:.55}
.pat.off{opacity:0}
@media (min-width:700px){.pat.rings{right:calc(50% - 400px)}}

/* ===== Каркас ===== */
.app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(20px + var(--safe-t)) 20px calc(32px + var(--safe-b));display:flex;flex-direction:column}
.app.has-dock{padding-bottom:calc(128px + var(--safe-b))}
.screen{display:flex;flex-direction:column;gap:32px}
.screen-in{animation:in .24s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-16{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Типографика ===== */
.h1{font:700 32px/34px var(--font-display)}
.h2{font:700 24px/28px var(--font-display)}
.sub-h{font:400 20px/24px var(--font-display)}
.label{font:700 14px/16px var(--font-display);text-transform:lowercase;letter-spacing:.02em;color:var(--amber-300)}
.counter{font:400 72px/72px var(--font-display);font-variant-numeric:tabular-nums}
.story{font:400 17px/26px var(--font-text)}
.body{font:400 15px/22px var(--font-text)}
.cap{font:500 13px/18px var(--font-text)}
.muted{color:rgba(255,255,255,.8)}
.story p+p,.body p+p{margin-top:12px}

/* ===== Логотип ===== */
.logo{display:flex;flex-direction:column;align-items:center;gap:14px;text-decoration:none}
.logo .em{width:132px;height:auto}
.logo .wd{width:236px;height:auto}
.logo-sm{display:flex;align-items:center;gap:10px;text-decoration:none;min-height:48px}
.logo-sm .em{width:40px;height:auto}
.logo-sm .nm{width:92px;height:auto}

/* ===== Место для маскота ===== */
.mascot{position:relative;height:224px;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.72)}
.mascot svg.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mascot .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 24px}
.mascot .in svg{width:28px;height:28px;color:var(--amber-300)}

/* ===== Срезы 45° ===== */
.cut{--cut:var(--cut-l);position:relative;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.cut::after{content:"";position:absolute;top:0;right:0;width:var(--cut);height:var(--cut);background:linear-gradient(to bottom left,transparent 50%,rgba(255,255,255,.28) 50%);pointer-events:none}
.cut-l{--cut:var(--cut-l);position:relative;clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut))}
.cut-l::after{content:"";position:absolute;top:0;left:0;width:var(--cut);height:var(--cut);background:linear-gradient(to bottom right,transparent 50%,var(--amber-500) 50%);pointer-events:none}
/* двойной срез — угловатые элементы управления: верх справа + низ слева */
.cut2{--cut:var(--cut-m);position:relative;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.cut2::after{content:"";position:absolute;top:0;right:0;width:var(--cut);height:var(--cut);background:linear-gradient(to bottom left,transparent 50%,rgba(255,255,255,.28) 50%);pointer-events:none}
.cut-s{--cut:var(--cut-s)}.cut-m{--cut:var(--cut-m)}.cut-xl{--cut:var(--cut-xl)}

/* ===== Поверхности ===== */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--glass-line);color:#fff}
.panel{background:var(--fog);color:var(--navy-900);border:1px solid var(--navy-200)}
.panel .label{color:var(--amber-700)}
.panel .muted{color:var(--n-600)}
.pad{padding:20px}

/* ===== Кнопки (двойной срез) ===== */
.btn{--cut:12px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border:0;cursor:pointer;font:600 16px/20px var(--font-text);text-decoration:none;text-align:center;width:100%;position:relative;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));transition:filter .15s}
.btn::after{content:"";position:absolute;top:0;right:0;width:var(--cut);height:var(--cut);background:linear-gradient(to bottom left,transparent 50%,rgba(255,255,255,.3) 50%)}
.btn-primary{background:var(--amber-500);color:var(--navy-950)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{filter:brightness(.94)}
.btn-glass{background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px var(--glass-line);color:#fff}
.btn-glass:hover{background:rgba(9,19,61,.7)}
.btn-ghost-panel{background:transparent;color:var(--navy-600);box-shadow:inset 0 0 0 1.5px var(--navy-300)}
.btn svg{width:20px;height:20px;flex:none}
.link{display:inline-flex;align-items:center;gap:8px;min-height:48px;background:none;border:0;cursor:pointer;font:600 16px/20px var(--font-text);color:#fff;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.panel .link{color:var(--navy-600)}
.link svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--fog);outline-offset:2px}
.panel :focus-visible{outline-color:var(--navy-600)}
.btn:focus-visible{clip-path:none}

/* ===== Нижняя панель ===== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(12px + var(--safe-b));pointer-events:none}
.dock-in{--cut:14px;max-width:406px;margin:0 auto;display:flex;gap:8px;padding:8px;pointer-events:auto;background:rgba(9,19,61,.8);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 12px 32px rgba(3,6,44,.35);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.dock .btn{white-space:nowrap}
.dock .btn-glass{width:auto;padding:0 16px}

/* ===== Шапка ===== */
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.chip-count{--cut:8px;font:700 14px/16px var(--font-display);padding:9px 12px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding-right:8px;font:600 15px/20px var(--font-text);text-decoration:none;color:#fff}
.back svg{width:20px;height:20px}
.iconlink{--cut:10px;display:grid;place-items:center;width:48px;height:48px;text-decoration:none;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.iconlink svg{width:22px;height:22px}

/* ===== Знак остановки ===== */
.badge{--cut:var(--cut-s);width:44px;height:44px;flex:none;display:grid;place-items:center;font:700 18px/20px var(--font-display);position:relative;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.badge::after{content:"";position:absolute;top:0;right:0;width:var(--cut);height:var(--cut);background:linear-gradient(to bottom left,transparent 50%,rgba(255,255,255,.3) 50%)}
.badge.closed{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--glass-line);color:rgba(255,255,255,.7)}
.badge.done{background:var(--amber-500);color:var(--navy-950)}
.badge.collect{background:linear-gradient(45deg,var(--amber-500) 50%,rgba(255,255,255,.1) 50%) 100% 100%/300% 300% no-repeat;color:var(--navy-950);animation:collect .48s var(--ease) forwards}
@keyframes collect{to{background-position:0 0}}

/* ===== Иконки моделей: обычная и активная ===== */
.ico{display:block;flex:none;width:64px;height:64px;object-fit:contain}
.ico.big{width:88px;height:88px}
.ico.sm{width:44px;height:44px}
.ico.dim{opacity:.45}
.ico.pop{animation:pop .48s var(--ease)}
@keyframes pop{0%{transform:scale(.86);filter:saturate(0)}100%{transform:none;filter:none}}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.strip .ico{width:100%;height:auto;aspect-ratio:1}
.strip-cap{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font:700 12px/14px var(--font-display);color:rgba(255,255,255,.72);text-align:center;margin-top:6px}

/* ===== Метки ===== */
.tag{--cut:7px;display:inline-flex;align-items:center;min-height:24px;padding:3px 12px;font:500 12px/16px var(--font-text);position:relative;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.tag.fact{background:var(--navy-100);color:var(--navy-700)}
.tag.edit{background:transparent;color:var(--amber-700);box-shadow:inset 0 0 0 1px var(--amber-500)}
.glass .tag.edit{color:var(--amber-300);box-shadow:inset 0 0 0 1px var(--amber-400)}
.tags{display:flex;flex-wrap:wrap;gap:8px}

/* ===== Прогресс: параллелограммы ===== */
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.bars i{height:8px;background:rgba(255,255,255,.2);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.bars i.on{background:var(--amber-500)}
.progress{display:flex;align-items:flex-end;gap:16px}
.progress .grow{padding-bottom:10px;display:flex;flex-direction:column;gap:10px}

/* ===== Маршрут: список ===== */
.route{list-style:none;display:flex;flex-direction:column}
.route li{display:grid;grid-template-columns:20px 1fr auto;column-gap:16px;position:relative;padding-bottom:20px}
.route li:last-child{padding-bottom:0}
.route li::before{content:"";position:absolute;left:9px;top:24px;bottom:0;width:0;border-left:2px dashed rgba(255,255,255,.6)}
.route li.passed::before{border-left:2px solid var(--amber-500)}
.route li.passed.grow-line::before{animation:line .6s var(--ease) both;transform-origin:top}
@keyframes line{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.route li:last-child::before{display:none}
.node{width:20px;height:20px;margin-top:2px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.node.done{background:var(--amber-500)}
.node.next{background:var(--fog)}
.node.ahead{background:rgba(255,255,255,.6);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%,2px 50%,50% calc(100% - 2px),calc(100% - 2px) 50%,50% 2px,2px 50%,0 50%)}
.node-wrap{position:relative}
.node-wrap.halo::before{content:"";position:absolute;left:-7px;top:-5px;width:34px;height:34px;background:rgba(244,248,255,.18);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.r-title{font:700 18px/22px var(--font-display);text-decoration:none;color:#fff}
a.r-title{text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:4px}
.r-zone{font:500 13px/18px var(--font-text);color:rgba(255,255,255,.72);margin-top:4px}
.r-status{font:700 13px/16px var(--font-display);text-transform:lowercase;padding-top:4px;white-space:nowrap}
.r-status.done{color:var(--amber-300)}.r-status.next{color:var(--fog)}.r-status.ahead{color:rgba(255,255,255,.6)}

/* ===== Карта ===== */
.mapcard{padding:0;overflow:hidden}
.mapcard .map{width:100%;height:auto}
.mapcard .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px 6px 20px;border-top:1px solid var(--navy-200)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:500 13px/18px var(--font-text)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,0 100%)}
.mapwrap{overflow:auto;margin:0 -20px;-webkit-overflow-scrolling:touch;background:#E3EBFF;border-top:1px solid var(--navy-200);border-bottom:1px solid var(--navy-200)}
.mapwrap .map{width:733px;height:auto;max-width:none}

/* ===== Коллекция ===== */
.cards{display:flex;flex-direction:column;gap:12px}
.ccard{display:flex;gap:16px;align-items:center;padding:14px 16px;text-decoration:none;--cut:var(--cut-m)}
.ccard .h{font:700 18px/22px var(--font-display)}
.ccard .t{margin-top:6px}
a.ccard.panel:hover{background:#fff}

/* ===== Сообщения ===== */
.msg{--cut:12px;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.msg .ic{width:24px;height:24px;flex:none;display:grid;place-items:center}
.msg .ic svg{width:22px;height:22px}
.msg .mark-sq{flex:none;width:16px;height:16px;margin:3px;background:var(--amber-500);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.msg.calm .mark-sq{background:var(--navy-300)}
.msg b{font-weight:600}
.err-ic{color:var(--err-dark)}

/* ===== Остановка ===== */
.model{display:flex;gap:16px;align-items:center}
.photo-card{padding:0;overflow:hidden}
.photo-card .ph{height:150px;background-size:cover;background-position:center;opacity:.6;filter:grayscale(.35);-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.photo-card .model{padding:0 20px 20px;margin-top:-56px;position:relative;align-items:flex-end}
.notice{--cut:10px;background:var(--navy-100);color:var(--navy-900);padding:12px 14px;font:400 15px/22px var(--font-text);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.notice b{font-weight:600}
.sevi{display:flex;gap:12px;align-items:center}
.sevi-av{--cut:8px;width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--navy-600);color:var(--fog);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.sevi-av svg{width:22px;height:22px}
.record{display:flex;gap:14px;align-items:center;padding:16px;--cut:var(--cut-m)}
.reveal{display:flex;flex-direction:column;gap:12px}
.next-card{display:flex;gap:16px;align-items:flex-start}
.src{font:500 13px/18px var(--font-text);color:var(--n-600);border-top:1px solid var(--navy-200);padding-top:12px}

/* ===== Поле ввода ===== */
.field{display:flex;flex-direction:column;gap:8px}
.field textarea{--cut:12px;width:100%;min-height:104px;resize:vertical;padding:12px 14px;border:0;background:#fff;color:var(--navy-900);font:400 17px/26px var(--font-text);box-shadow:inset 0 0 0 1.5px var(--navy-300);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.field textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--navy-600)}
.field textarea::placeholder{color:var(--n-500)}

/* ===== Памятка ===== */
.memo{--cut:var(--cut-xl);padding:28px 24px 24px}
.memo ol{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.memo li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:500 13px/16px var(--font-text)}
.memo li .ico{width:56px;height:56px}
.memo .counter{color:var(--amber-700)}
.memo .wd{width:150px;height:auto}

/* ===== Сканер ===== */
.cam{position:relative;width:100%;aspect-ratio:3/4;max-height:56vh;overflow:hidden;background:#07090E;margin:0 auto}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame-qr{position:absolute;left:18%;right:18%;top:50%;aspect-ratio:1;transform:translateY(-58%);pointer-events:none;color:var(--fog)}
.frame-qr svg{width:100%;height:100%;overflow:visible}
.cam-hint{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;padding:10px 12px;font:500 14px/18px var(--font-text)}
.cam-off{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
details.demo{border-top:1px solid var(--glass-line);padding-top:12px}
details.demo summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font:500 14px/18px var(--font-text);color:rgba(255,255,255,.75)}
.demo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.demo-grid button{min-height:48px;font:700 15px/18px var(--font-display);cursor:pointer}

/* ===== Загрузка ===== */
.sk{height:16px;background:rgba(255,255,255,.12);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-100%);animation:sh 1.4s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.loader{height:3px;background:rgba(255,255,255,.15);overflow:hidden}

const legend=()=>`<div class="legend"><span><i style="background:var(--amber-500)"></i>открыта</span><span><i style="background:var(--fog);box-shadow:inset 0 0 0 2px var(--navy-900)"></i>следующая</span><span><i style="background:var(--navy-900)"></i>впереди</span></div>`;

/* ---------- Роутер ---------- */
const app=document.getElementById('app'),dock=document.getElementById('dock'),scrim=document.getElementById('scrim'),photo=document.getElementById('photo');
function go(name){if(location.hash==='#'+name)render();else location.hash=name;}
window.addEventListener('hashchange',render);
window.addEventListener('offline',()=>{if(['','start','route','scan','return'].includes(cur()))render();});
function cur(){return (location.hash||'').slice(1);}
function setBg(v){
  scrim.className='scrim '+(v.scrim||'focus');
  if(v.bg){const src='img/photo/'+v.bg+'.jpg';if(photo.getAttribute('src')!==src)photo.src=src;photo.hidden=false;}else{photo.hidden=true;}
  document.getElementById('patRings').classList.toggle('off',!v.rings);
  document.getElementById('patWaves').classList.toggle('off',v.waves===false);
  document.getElementById('patTop').classList.toggle('off',!v.wavesTop);
}
function setDock(html){if(html){dock.innerHTML='<div class="dock-in">'+html+'</div>';dock.hidden=false;app.classList.add('has-dock');}else{dock.hidden=true;dock.innerHTML='';app.classList.remove('has-dock');}}
function announce(t){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=t,30);}
function reviewBar(){return PREVIEW?`<div class="review">Режим обзора · прогресс условный<a href="#screens" data-act="exit-preview">Выйти</a></div>`:'';}

function render(){
  stopCam();
  const r=cur();
  document.body.classList.remove('calm');
  if(!booted){booted=true;if(!r||r==='start'){ if(S.opened.length&&!S.finished&&!sessionStorage.getItem('dm-back')){try{sessionStorage.setItem('dm-back','1')}catch(e){} return show(viewLoading,()=>go('return'));} } else return show(viewLoading,()=>render());}
  if(!navigator.onLine&&['','start','route','scan','return'].includes(r)){return paint(viewOffline());}
  let v;
  if(!r||r==='start') v=viewStart();
  else if(r==='route') v=viewRoute();
  else if(r==='map') v=viewMap();
  else if(/^stop-\d+$/.test(r)){const id=+r.split('-')[1]; v=P_(id)?viewStop(id):viewError();}
  else if(r==='scan') v=viewScan();
  else if(r==='collection') v=viewCollection();
  else if(r==='finish') v=viewFinish();
  else if(r==='memo') v=viewMemo();
  else if(r==='return') v=viewReturn();
  else if(r==='loading') v=viewLoading();
  else if(r==='error') v=viewError();
  else if(r==='offline') v=viewOffline();
  else if(r==='screens') v=viewScreens();
  else v=viewError();
  paint(v);
}
function show(viewFn,then){paint(viewFn());setTimeout(then,650);}
function paint(v){
  setBg(v);
  if(v.calm)document.body.classList.add('calm');
  app.innerHTML=reviewBar()+'<div class="screen screen-in">'+v.html+'</div>';
  setDock(v.dock||'');
  window.scrollTo(0,0);
  if(v.after)v.after();
  if(v.say)announce(v.say);
  const h=app.querySelector('h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
}

/* ---------- Общие куски ---------- */
const btn=(label,{kind='primary',href,act,icon,iconL,data=''}={})=>{
  const inner=(iconL?ic(iconL):'')+`<span>${label}</span>`+(icon?ic(icon):'');
  const cls='btn btn-'+kind;
  return href?`<a class="${cls}" href="#${href}" ${data}>${inner}</a>`:`<button type="button" class="${cls}" data-act="${act||''}" ${data}>${inner}</button>`;
};
const link=(label,href,icon='right')=>`<a class="link" href="#${href}">${label}${icon?ic(icon):''}</a>`;
const bars=()=>`<div class="bars" aria-hidden="true">${POINTS.map(p=>`<i class="${isOpen(p.id)?'on':''}"></i>`).join('')}</div>`;
const progressLine=()=>`Записей открыто: ${count()} из 6`;
const progress=()=>`<div class="progress"><div class="counter" aria-hidden="true">${count()}/6</div><div class="grow">${bars()}<div class="cap muted">${progressLine()}</div></div></div>`;
const topbar=(left)=>`<div class="top">${left}<div class="grow"></div><span class="glass chip-count" aria-label="${progressLine()}">${count()}/6</span><a class="glass iconlink" href="#collection" aria-label="Моя коллекция">${ic('coll')}</a></div>`;
const backTo=(href,label)=>`<a class="back" href="#${href}">${ic('left')}${label}</a>`;
const msg=(html,{kind='panel',mark=true,calm=false,icon}={})=>`<div class="msg ${kind} ${calm?'calm':''}" role="status">${icon?`<span class="ic">${icon}</span>`:(mark?'<span class="mark-sq" aria-hidden="true"></span>':'')}<div class="body">${html}</div></div>`;
const dockRoute=()=>btn('Сканировать QR',{href:'scan',iconL:'qr'})+`<a class="btn btn-glass" href="#collection" aria-label="Моя коллекция">${ic('coll')}<span>Коллекция</span></a>`;

  return {bg:'start',scrim:'ambient',rings:true,html:`

  ${mascot()}

    <p class="story">Привет, я Севи. Я привёз образы шести соловецких мест в Новый Херсонес. Здесь у каждого северного сюжета найдётся история южного берега — своя, не похожая на него. Иди от модели к модели, читай обе истории и помоги мне понять, как люди сохраняют память о месте.</p>
  </section>
  <section aria-label="Шесть моделей маршрута">

    <div class="strip-cap" aria-hidden="true">${POINTS.map(p=>`<span>${pad2(p.id)}</span>`).join('')}</div>
  </section>
  <section class="panel cut pad stack">
    <span class="label">с чего начать</span>
    <p class="body">Начни у КПП «Восток», сразу после входа. Найди модель Святых ворот с номером 1. Следующая загадка назовёт место Нового Херсонеса, где стоит модель № 2.</p>
  </section>
  <div class="stack-16">
    <div class="cap muted">${progressLine()}</div>

    <a class="cap muted" href="#screens" style="align-self:center;padding:12px">Обзор всех экранов</a>

/* ---------- 02 Активный маршрут ---------- */
function viewRoute(){
  const nx=nextId();
  const goal=nx?(()=>{const p=P_(nx);return `<section class="glass cut pad"><div class="row" style="align-items:flex-start;gap:16px"><div class="grow stack"><span class="label">следующая точка</span><h2 class="h2">№ ${p.id} · ${p.model}</h2><p class="body">Ищи её в зоне «${p.zone}».</p></div>${ico(p.id,false)}</div></section>`;})()
    :`<section class="glass cut pad stack"><span class="label">маршрут пройден</span><h2 class="h2">Все шесть записей собраны</h2>${link('Открыть итог','finish')}</section>`;
  const items=POINTS.map(p=>{
    const done=isOpen(p.id),isNext=p.id===nx;
    const cls=done?'done':isNext?'next':'ahead';
    const status=done?'открыта':isNext?'следующая':'впереди';
    const passed=done&&isOpen(p.id+1);
    const title=done?`<a class="r-title" href="#stop-${p.id}">${pad2(p.id)} · ${p.model}</a>`:`<span class="r-title">${pad2(p.id)} · ${p.model}</span>`;
    return `<li class="${passed?'passed':''} ${justOpened===p.id+1?'grow-line':''}"><span class="node-wrap ${isNext?'halo':''}"><span class="node ${cls}"></span></span><div>${title}<div class="r-zone">${p.zone}</div></div><span class="r-status ${cls}">${status}</span></li>`;
  }).join('');
  justOpened=null;
  return {bg:'route',scrim:'focus',html:`
  ${topbar(logoSm())}
  <header class="stack" style="gap:8px"><h1 class="h1">Маршрут Севи</h1><p class="sub-h muted">Шесть историй двух морей</p></header>
  ${progress()}
  ${goal}
  <section class="panel cut mapcard" aria-label="Карта маршрута">
    <a href="#map" aria-label="Открыть карту крупно">${mapSVG()}</a>
    <div class="foot">${legend()}${link('Крупно','map','')}</div>
  </section>
  <p class="body muted">Найди модель на площадке и сканируй QR-код на подставке. Если уже открыл историю, её можно перечитать в коллекции.</p>
  <section class="stack-16" aria-label="Точки маршрута"><span class="label">точки маршрута</span><ol class="route">${items}</ol></section>`,
  dock:dockRoute(),say:'Маршрут Севи. '+progressLine()};
}
function viewMap(){
  return {bg:'route',scrim:'reading',waves:false,html:`
  ${topbar(backTo('route','К маршруту'))}
  <header class="stack" style="gap:8px"><span class="label">карта маршрута · новый херсонес</span><h1 class="h1">Шесть точек Севи</h1><p class="body muted">Сдвигай карту пальцем. Точное место модели — на подставке с номером.</p></header>
  <div class="mapwrap" id="mapwrap">${mapSVG()}</div>
  <div class="legend">${legend().replace('<div class="legend">','').replace(/<\/div>$/,'')}</div>`,
  dock:dockRoute(),after:()=>{const w=document.getElementById('mapwrap');const nx=nextId()||6;w.scrollLeft=Math.max(0,NODES[nx][0]-w.clientWidth/2);}};
}

/* ---------- 03 Открытая остановка ---------- */
function viewStop(id){
  const p=P_(id);
  if(!isOpen(id)) return viewLocked(p);
  const s=st(); const rv=s.rev[id]||{};
  const nxt=P_(id+1);
  const f=flash&&flash.id===id?flash:null; flash=null;
  const toast=f?(f.kind==='first'
      ? msg(p.calm?`<b>История прочитана.</b> Прогресс: ${count()} из 6.`:`<b>Запись открыта.</b> Прогресс: ${count()} из 6.`,{calm:p.calm})
      : f.kind==='repeat'? msg('Ты уже открыл эту историю. Прочти её ещё раз — прогресс не изменится.',{mark:false,icon:ic('book')})
      : msg(`Ты нашёл точку № ${id} раньше подсказки. Её история открыта. Рекомендуемый порядок показан в маршруте.`)):'';
  const riddle=p.riddle?`
  <section class="glass cut pad stack-16" id="riddle">
    <span class="label">загадка</span>
    <p class="story">${p.riddle}</p>
    ${rv.hint||rv.answer?`<div class="notice"><b>Подсказка.</b> ${p.hint}</div>`:btn('Показать подсказку',{kind:'glass',act:'hint',iconL:'hint',data:`data-id="${id}"`})}
    ${rv.answer?'':btn('Показать ответ и следующую точку',{kind:'glass',act:'answer',data:`data-id="${id}"`})}
  </section>`:'';
  const after=(rv.answer||!p.riddle)?`
  <section class="reveal" id="next">
    ${p.riddle?`<div class="panel cut pad stack"><span class="label">ответ</span><p class="h2" style="color:var(--navy-900)">${p.answer}</p></div>`:''}
    <div class="glass cut pad stack-16">
      ${nxt?`<div class="next-card"><div class="grow stack"><span class="label">дальше · ${nxt.zone}</span><p class="h2">№ ${nxt.id} · ${nxt.model}</p></div>${ico(nxt.id,isOpen(nxt.id))}</div>`:`<span class="label">маршрут завершён</span>`}
      <p class="body">${p.go}</p>
      ${nxt?btn('Продолжить маршрут',{href:'route',icon:'right'}):btn('Открыть итог',{href:'finish',icon:'right'})}
    </div>
  </section>`:'';
  const firstOpen=f&&f.kind==='first'&&!p.calm;
  return {bg:'p'+id,scrim:'reading',calm:p.calm,html:`
  ${topbar(backTo('route','К маршруту'))}
  ${toast}
  <header class="stack" style="gap:6px"><span class="label">точка ${pad2(id)} · ${p.zone}</span><h1 class="h1">${p.title}</h1></header>
  <section class="glass cut photo-card"><div class="ph" style="background-image:url(img/photo/p${id}.jpg)" role="img" aria-label="Фото: ${p.model}, Соловки"></div><div class="model">${ico(id,true,'big '+(firstOpen?'pop':''))}<div class="grow stack" style="gap:8px"><p class="r-title" style="font-size:20px;line-height:24px">${p.model}</p><p class="cap muted">${p.proto}</p><div class="tags"><span class="tag edit">Современная модель</span></div></div></div></section>
  <section class="panel cut pad stack-16" aria-label="История Нового Херсонеса">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="label">этот берег · новый херсонес</span><span class="tag fact">Историческая справка</span></div>
    <div class="story">${p.here.map(t=>`<p>${t}</p>`).join('')}</div>
    <div class="notice"><b>Заметь.</b> ${p.act}</div>
  </section>
  <section class="glass cut-l pad stack-16" aria-label="История Соловков" style="padding-left:28px">
    <span class="label">другой берег · соловки</span>
    <div class="story">${p.there.map(t=>`<p>${t}</p>`).join('')}</div>
  </section>
  <section class="panel cut pad stack-16" aria-label="Связь двух берегов">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div class="sevi"><span class="sevi-av">${ic('wind')}</span><span class="label">севи связывает берега</span></div></div>
    <p class="story">${p.sevi}</p>
    <p class="src">Тексты сверяются с площадкой и профильными специалистами перед публикацией.</p>
  </section>
  <section class="record glass cut" aria-label="Строка коллекции"><div class="badge ${firstOpen?'collect':'done'}" aria-hidden="true">${pad2(id)}</div><div><span class="label">запись ${id} в коллекции</span><p class="body" style="margin-top:4px">${p.rec.charAt(0).toUpperCase()+p.rec.slice(1)}</p></div></section>
  ${riddle}
  ${after}
  <div>${link('Моя коллекция','collection')}</div>`,
  say:p.title};
}
function viewLocked(p){
  return {bg:'route',scrim:'focus',html:`
  ${topbar(backTo('route','К маршруту'))}
  <header class="model"><div class="badge closed" aria-hidden="true">${pad2(p.id)}</div><div class="grow stack" style="gap:6px"><span class="label">точка ${pad2(p.id)} · ${p.zone}</span><h1 class="h1">${p.model}</h1></div></header>
  ${sevi('surprised','Севи ждёт',230)}
  <section class="glass cut pad stack-16"><div class="model">${ico(p.id,false,'big dim')}<p class="body grow">История этой точки откроется, когда ты сканируешь QR-код на подставке модели.</p></div>
  <p class="body muted">Ищи модель № ${p.id} в зоне «${p.zone}».</p></section>`,
  dock:btn('Сканировать QR',{href:'scan',iconL:'qr'})};
}

/* ---------- 04 / 07 / 08 Коллекция ---------- */
function viewCollection(){
  const n=count();
  const list=`<div class="cards">${POINTS.map(p=>isOpen(p.id)

}

  </section>

    <div class="sevi"><span class="sevi-av">${ic('wind')}</span><span class="label">последняя строка севи</span></div>
    <p class="sub-h">${SEVI_LINE}</p>
  </section>
  <form class="panel cut pad stack-16" id="lineform">
    <div class="field"><label class="label" for="line">по желанию</label>

    <textarea id="line" name="line" maxlength="280" placeholder="Моя последняя строка…">${esc(s.line||'')}</textarea>

  <p class="cap muted">${progressLine()}</p>`,say:'Шесть историй услышаны'};
}

/* ---------- 06 Памятка ---------- */

/* ---------- 09 QR ---------- */
let camStream=null,camLoop=0;
function viewScan(){
  return {bg:null,scrim:'camera',waves:false,html:`
  <div class="top">${backTo('route','К маршруту')}<div class="grow"></div><span class="glass chip-count">${count()}/6</span></div>
  <header class="stack" style="gap:8px"><h1 class="h1">Сканируй код модели</h1><p class="body muted">Наведи камеру на QR-код на подставке. Проверь номер модели рядом с кодом.</p></header>
  <div class="cam cut2" id="cam">
    <video id="vid" playsinline muted></video>
    <div class="frame-qr" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M0 24V10A10 10 0 0 1 10 0h14M76 0h14a10 10 0 0 1 10 10v14M0 76v14a10 10 0 0 0 10 10h14M76 100h14a10 10 0 0 0 10-10V76"/></svg></div>
    <div class="cam-hint glass" id="camhint">Включаем камеру…</div>
  </div>
  <div id="scanmsg"></div>
  <div class="stack">
    <label class="btn btn-glass filebtn">${ic('cam')}<span>Сфотографировать код</span><input type="file" accept="image/*" capture="environment" id="qrfile"></label>
    ${btn('Открыть список точек',{kind:'glass',href:'route',iconL:'route'})}
  </div>
  <details class="demo"><summary>Проверка макета без QR: имитировать скан</summary>
    <div class="demo-grid">${POINTS.map(p=>`<button type="button" class="glass cut2" data-act="demo-scan" data-id="${p.id}">№ ${p.id}</button>`).join('')}<button type="button" class="glass cut2" data-act="demo-bad" style="grid-column:span 3;font-family:var(--font-text);font-weight:500;font-size:14px">Чужой код</button></div>
  </details>`,after:startCam};
}
function camDenied(){
  const c=document.getElementById('cam');if(!c)return;
  c.innerHTML=`<div class="cam-off"><div class="stack-16" style="align-items:center"><span style="color:var(--amber-300)">${ic('cam').replace('<svg','<svg style="width:40px;height:40px"')}</span><p class="h2">Камера недоступна</p><p class="body muted">Разреши доступ в браузере или открой точку из списка маршрута. Можно также сфотографировать код.</p></div></div>`;
}
async function startCam(){
  document.getElementById('qrfile').addEventListener('change',onFile);
  const hint=document.getElementById('camhint');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camDenied();return;}
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    if(cur()!=='scan'){stopCam();return;}
    const v=document.getElementById('vid');v.srcObject=camStream;await v.play();
    hint.textContent='Наведи камеру на QR-код';
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(!camStream)return;
      if(v.readyState>=2&&window.jsQR){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const d=cx.getImageData(0,0,cv.width,cv.height);const q=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});if(q&&q.data){handleCode(q.data);return;}}
      camLoop=requestAnimationFrame(tick);
    };tick();
  }catch(e){camDenied();}
}
function stopCam(){if(camLoop)cancelAnimationFrame(camLoop);camLoop=0;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}}
function onFile(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const cv=document.createElement('canvas');const k=Math.min(1,1400/Math.max(img.width,img.height));cv.width=img.width*k;cv.height=img.height*k;
    const cx=cv.getContext('2d');cx.drawImage(img,0,0,cv.width,cv.height);
    const d=cx.getImageData(0,0,cv.width,cv.height);const q=window.jsQR?jsQR(d.data,d.width,d.height):null;
    URL.revokeObjectURL(img.src);
    if(q&&q.data)handleCode(q.data);else scanError('fail');
  };img.onerror=()=>scanError('fail');img.src=URL.createObjectURL(f);e.target.value='';
}
function parseCode(t){const m=String(t).match(/(?:dva-?morya|dvamorya|два\s?моря)[^0-9]{0,8}([1-6])\b|#stop-([1-6])\b/i);return m?+(m[1]||m[2]):null;}
function handleCode(t){const id=parseCode(t);if(id)registerScan(id);else scanError('unknown');}
function scanError(kind){
  const box=document.getElementById('scanmsg');if(!box)return;
  box.innerHTML=kind==='fail'
    ?msg('Код не удалось прочитать. Наведи камеру на QR ещё раз или открой точку из списка маршрута.',{icon:ic('alert'),mark:false})
    :msg('Этот код не относится к маршруту Севи. Проверь номер модели и попробуй ещё раз.',{icon:ic('alert'),mark:false});
  box.querySelector('.ic').style.color='var(--err-light)';
  announce(box.textContent.trim());
}
function registerScan(id){
  stopCam();
  const s=st();const nx=nextId();
  if(!s.opened.includes(id)){
    s.opened.push(id);s.opened.sort((a,b)=>a-b);s.started=true;save();
    justOpened=id;
    flash={id,kind:(nx!==null&&id>nx)?'early':'first'};
  } else flash={id,kind:'repeat'};
  go('stop-'+id);
}

/* ---------- 10–13 Служебные ---------- */
function viewReturn(){
  const nx=nextId();
  return {bg:'return',scrim:'ambient',rings:true,html:`
  ${logoBig()}
  ${sevi('surprised','Севи рад встрече',230)}

  ${nx?`<section class="glass cut pad"><div class="row" style="align-items:flex-start;gap:16px"><div class="grow stack"><span class="label">следующая точка</span><p class="h2">№ ${nx} · ${P_(nx).model}</p><p class="body">Зона «${P_(nx).zone}».</p></div>${ico(nx,false)}</div></section>`:''}
  <div class="stack">${btn('Продолжить маршрут',{href:'route',icon:'right'})}${btn('Моя коллекция',{kind:'glass',href:'collection',iconL:'coll'})}</div>`};

function viewLoading(){
  return {bg:'start',scrim:'ambient',rings:true,html:`
  ${logoBig()}
  ${sevi('sleep','Севи дремлет, пока маршрут загружается',240)}
  <div class="loader" aria-hidden="true"><i></i></div>
  <h1 class="h1">Открываем маршрут</h1>

  <div class="glass cut pad stack" aria-hidden="true"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:60%"></div></div>`,say:'Открываем маршрут'};
}
function viewError(){
  return {bg:'error',scrim:'focus',html:`
  ${logoSm()}
  ${sevi('angry','Севи сердится',220)}
  <section class="glass cut pad stack-16">
    <span style="color:var(--err-dark)">${ic('alert').replace('<svg','<svg style="width:36px;height:36px"')}</span>
    <h1 class="h1">Не удалось открыть историю</h1>
    <p class="story">Попробуй загрузить её ещё раз. Если ошибка повторится, вернись к маршруту и открой точку позже.</p>
  </section>
  <div class="stack">${btn('Повторить',{act:'retry',iconL:'retry'})}${btn('К маршруту',{kind:'glass',href:'route',iconL:'left'})}</div>`,say:'Не удалось открыть историю'};
}
function viewOffline(){
  return {bg:'error',scrim:'focus',html:`
  ${logoSm()}
  ${sevi('sad','Севи грустит',220)}
  <section class="glass cut pad stack-16">
    <span style="color:var(--amber-300)">${ic('wifioff').replace('<svg','<svg style="width:36px;height:36px"')}</span>
    <h1 class="h1">Нет соединения</h1>
    <p class="story">Проверь связь и попробуй снова. Уже открытые записи останутся в этом браузере.</p>
  </section>
  <div class="stack">${btn('Повторить',{act:'retry',iconL:'retry'})}${btn('Моя коллекция',{kind:'glass',href:'collection',iconL:'coll'})}</div>`,say:'Нет соединения'};
}

/* ---------- Обзор экранов ---------- */
const SHOTS=[
 ['01','Вход и площадка','start',[]],
 ['02','Активный маршрут','route',[1,2]],
 ['02','Карта маршрута','map',[1,2]],
 ['03','Открытая остановка · точка 1','stop-1',[1],{flash:'first'}],
 ['03','Остановка · ответ и переход','stop-2',[1,2],{rev:{2:{hint:1,answer:1}}}],
 ['03','Остановка · раннее открытие','stop-4',[1,4],{flash:'early'}],
 ['03','Остановка · спокойный режим, точка 5','stop-5',[1,2,3,4,5],{flash:'first'}],
 ['03','Точка ещё не открыта','stop-3',[1,2]],
 ['04','Коллекция','collection',[1,2]],
 ['05','Маршрут пройден','finish',[1,2,3,4,5,6]],
 ['06','Памятка','memo',[1,2,3,4,5,6],{line:'Расскажу про лодку: за видом моря всегда стоит чья-то работа.'}],
 ['07','Коллекция — пустая','collection',[]],
 ['08','Коллекция — полная','collection',[1,2,3,4,5,6]],
 ['09','QR — сканирование','scan',[1,2]],
 ['10','Возвращение к маршруту','return',[1,2]],
 ['11','Загрузка','loading',[]],
 ['12','Ошибка загрузки','error',[]],
 ['13','Нет сети','offline',[1,2]]
];
function viewScreens(){
  PREVIEW=null;
  return {bg:'start',scrim:'reading',html:`
  <div class="top">${backTo('start','На старт')}</div>
  <header class="stack" style="gap:8px"><span class="label">согласование макета</span><h1 class="h1">Все экраны</h1><p class="body muted">Каждый экран открывается с условным прогрессом. Настоящий прогресс в браузере не меняется.</p></header>
  <nav class="stack idx" style="gap:8px">${SHOTS.map((s,i)=>`<a class="glass cut2" href="#${s[2]}" data-act="preview" data-i="${i}"><span>${s[0]}</span><span class="grow">${s[1]}</span>${ic('right').replace('<svg','<svg style="width:18px;height:18px;flex:none"')}</a>`).join('')}</nav>
  <section class="stack-16"><span class="label">иконки моделей: обычная и активная</span><div class="strip">${POINTS.map(p=>ico(p.id,false)).join('')}</div><div class="strip">${POINTS.map(p=>ico(p.id,true)).join('')}</div></section>
  <section class="stack-16"><span class="label">тестовые qr-коды</span><p class="body muted">Распечатай или открой на втором экране и сканируй со страницы «QR — сканирование». В коде лежит текст вида «dva-morya:stop-3».</p><div class="qrs" id="qrs"></div></section>
  <section class="panel cut pad stack"><span class="label">прогресс</span><p class="body">Сейчас в этом браузере: ${S.opened.length} из 6.</p>${btn('Сбросить мой прогресс',{kind:'ghost-panel',act:'reset'})}</section>`,
  after:()=>{const box=document.getElementById('qrs');const draw=()=>{if(!window.QRCode){setTimeout(draw,200);return;}POINTS.forEach(p=>{const fig=document.createElement('figure');const q=document.createElement('div');q.className='q';fig.appendChild(q);fig.insertAdjacentHTML('beforeend',`<figcaption>№ ${p.id} · ${p.model}</figcaption>`);box.appendChild(fig);new QRCode(q,{text:'dva-morya:stop-'+p.id,width:240,height:240,colorDark:'#09133D',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});});};draw();}};
}

/* ---------- События ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=+a.dataset.id;
  if(act==='hint'||act==='answer'){const s=st();s.rev[id]=Object.assign(s.rev[id]||{},act==='hint'?{hint:1}:{hint:1,answer:1});save();const y=window.scrollY;render();window.scrollTo(0,y);
    requestAnimationFrame(()=>{const el=document.getElementById(act==='answer'?'next':'riddle');if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});});}
  else if(act==='demo-scan')registerScan(id);
  else if(act==='demo-bad')scanError('unknown');
  else if(act==='retry'){if(navigator.onLine){go('route');}else announce('Соединения всё ещё нет');}
  else if(act==='finish-skip'){const s=st();s.finished=true;save();go('memo');}
  else if(act==='reset'){S=blank();save();try{sessionStorage.removeItem('dm-back')}catch(_){}render();}
  else if(act==='exit-preview'){PREVIEW=null;}
  else if(act==='preview'){const sh=SHOTS[+a.dataset.i];const o=sh[4]||{};PREVIEW=Object.assign(blank(),{opened:sh[3].slice(),line:o.line||'',rev:o.rev||{},started:true});
    if(o.flash){const fid=+sh[2].split('-')[1];flash={id:fid,kind:o.flash};}
    if(sh[2]==='offline'){e.preventDefault();paint(viewOffline());history.replaceState(null,'','#offline');}
    else if(sh[2]==='loading'){e.preventDefault();paint(viewLoading());history.replaceState(null,'','#loading');}}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='lineform')return;e.preventDefault();
  const v=document.getElementById('line').value.trim();const s=st();s.line=v;s.finished=true;save();
  go(v?'memo':'finish');
});
render();
</script>
